# docker compose -f autopilot/docker-compose.yml up -d --build   (logs: docker compose ... logs -f autopilot)
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: crm
      POSTGRES_PASSWORD: crm
      POSTGRES_DB: crm_test
    restart: unless-stopped
  autopilot:
    build: { context: ., dockerfile: Dockerfile }
    depends_on: [db]
    env_file: [autopilot.env]
    environment:
      DATABASE_URL: postgresql://crm:crm@db:5432/crm_test
    volumes:
      - ../:/work
    restart: "no"
