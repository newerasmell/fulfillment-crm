# Render Blueprint (BACKLOG P0-12). Created at GATE P0-G1 by the owner: Render → New → Blueprint → this repo.
# Creates NEW services only; it does not touch any service that already exists in the Render account.
# Nothing here is a secret: CREDENTIALS_KEY is entered by hand in the "crm-secrets" group (sync: false),
# AUTH_SECRET is generated by Render, DATABASE_URL comes from the database below.
envVarGroups:
  - name: crm-secrets
    envVars:
      - key: CREDENTIALS_KEY # 32 random bytes, base64 — the SAME value for web and worker; never change it later
        sync: false
      - key: AUTH_SECRET
        generateValue: true

services:
  - type: web
    name: fulfillment-crm-web
    runtime: node
    region: frankfurt
    plan: starter
    branch: main
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm build
    # Migrations run once per deploy, before the new version receives traffic. If one fails the deploy
    # stops and the previous version keeps running (no crash loop).
    preDeployCommand: pnpm db:deploy
    startCommand: pnpm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: AUTH_TRUST_HOST
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: fulfillment-crm-db
          property: connectionString
      - fromGroup: crm-secrets

  - type: worker
    name: fulfillment-crm-worker
    runtime: node
    region: frankfurt
    plan: starter
    branch: main
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm db:generate
    startCommand: pnpm worker
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: SERVICE_NAME
        value: worker
      - key: DATABASE_URL
        fromDatabase:
          name: fulfillment-crm-db
          property: connectionString
      - fromGroup: crm-secrets

databases:
  - name: fulfillment-crm-db
    databaseName: fulfillment_crm
    region: frankfurt
    plan: basic-256mb
    postgresMajorVersion: "16"
